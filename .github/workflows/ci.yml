name: sample
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sample
  cancel-in-progress: true
jobs:
  sample:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sample
        run: tar xzf sample.tar.gz && ls sample
      - name: Build image (timed)
        run: |
          mkdir -p ci
          start=$(date +%s)
          docker build --platform linux/amd64 -t blast-radius-entry . 2>&1 | tee ci/build.log | tail -n 60
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a ci/build.log
      - name: Run like the scorer, 3 times
        run: |
          for i in 1 2 3; do
            start=$(date +%s.%N)
            docker run --rm --platform linux/amd64 --network none --cpus 2 \
              --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp \
              --volume $PWD/sample/commits:/data/commits:ro \
              --volume $PWD/sample/tests.json:/data/tests.json:ro \
              --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
              > ci/output$i.jsonl 2> ci/stderr$i.log || echo "run failed $?" >> ci/stderr$i.log
            echo "wall: $(echo "$(date +%s.%N) - $start" | bc)" >> ci/stderr$i.log
            python3 score.py sample sample/answers.json ci/output$i.jsonl > ci/score$i.txt 2>&1 || true
            cat ci/score$i.txt; tail -n 3 ci/stderr$i.log
          done
      - name: Probe check on mutants (real environment)
        if: hashFiles('tools/mutants.tar.gz') != ''
        run: |
          mkdir -p /tmp/mut/commits ci/probe && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          chmod -R a+rwX ci/probe
          docker run --rm --network none --cpus 2 --memory 4096m --pids-limit 256 \
            --tmpfs /tmp:rw,size=512m,mode=1777 --user 65534:65534 --env HOME=/tmp \
            --env BR_BET_LOG=/out/bets.json \
            --volume /tmp/mut/commits:/data/commits:ro --volume /tmp/mut/tests.json:/data/tests.json:ro \
            --volume $PWD/ci/probe:/out --volume $PWD/tools:/tools:ro \
            --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py > /out/output.jsonl 2> /out/stderr.log; python /tools/check_bets.py /data/commits /out/bets.json /out/report.json > /out/check.log 2>&1' || true
          tail -n 5 ci/probe/stderr.log; cat ci/probe/check.log | tail -n 60
      - name: Calibrate on mutants with stored truth (only with [calib])
        if: contains(github.event.head_commit.message, '[calib]')
        run: |
          mkdir -p /tmp/mut/commits ci/calib && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          for f in 1.0 1.5 2.0 2.5; do
            for set in mut sample; do
              if [ $set = mut ]; then D=/tmp/mut; T=tools/truth.json; else D=$PWD/sample; T=""; fi
              docker run --rm --platform linux/amd64 --network none --cpus 2 \
                --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
                --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
                --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp --env BR_CPU_FACTOR=$f \
                --volume $D/commits:/data/commits:ro --volume $D/tests.json:/data/tests.json:ro \
                --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
                > ci/calib/out_${set}_$f.jsonl 2> ci/calib/err_${set}_$f.log || true
              cpu=$(grep -o "usage_usec [0-9]*" ci/calib/err_${set}_$f.log | awk '{print $2/1000000}')
              if [ $set = mut ]; then r=$(python3 tools/score_truth.py /tmp/mut/tests.json $T ci/calib/out_${set}_$f.jsonl | tail -n 1)
              else r=$(python3 score.py sample sample/answers.json ci/calib/out_${set}_$f.jsonl | head -n 2 | tr '\n' ' '); fi
              echo "factor $f $set: $r CPU $cpu" | tee -a ci/calib/summary.txt
            done
          done
      - name: Ground truth on mutants (only when the commit message has [truth])
        if: contains(github.event.head_commit.message, '[truth]')
        run: |
          mkdir -p /tmp/mut/commits ci/truth && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          chmod -R a+rwX ci/truth
          docker run --rm --network none --cpus 4 --memory 12g --pids-limit 1024 \
            --tmpfs /tmp:rw,size=4g,mode=1777 --user 65534:65534 --env HOME=/tmp \
            --volume /tmp/mut:/data:ro --volume $PWD/ci/truth:/out --volume $PWD/tools:/tools:ro \
            --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py > /out/selected.jsonl 2> /out/stderr.log; python /tools/truth.py /data /out/selected.jsonl /out/truth.json > /out/truth.log 2>&1' || true
          tail -n 60 ci/truth/truth.log
      - name: Export the in-image map and cpu costs
        run: |
          docker run --rm --entrypoint cat blast-radius-entry /app/br/maps/map.json.gz > ci/map.json.gz
          docker run --rm --entrypoint cat blast-radius-entry /app/br/maps/cpu.json > ci/cpu.json
      - name: Commit results back
        run: |
          rm -rf sample
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p maps
          if [ ! -f maps/map.json.gz ]; then cp ci/map.json.gz maps/map.json.gz; fi
          if [ ! -f maps/cpu.json ]; then cp ci/cpu.json maps/cpu.json; fi
          rm -f ci/map.json.gz ci/cpu.json
          git add ci maps
          git commit -m "CI results [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
