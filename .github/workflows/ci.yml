name: sample
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sample
  cancel-in-progress: true
jobs:
  sample:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sample
        run: tar xzf sample.tar.gz && ls sample
      - name: Build image (timed)
        run: |
          mkdir -p ci
          start=$(date +%s)
          docker build --platform linux/amd64 -t blast-radius-entry . 2>&1 | tee ci/build.log | tail -n 60
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a ci/build.log
      - name: Run like the scorer, 3 times
        run: |
          for i in 1 2 3; do
            start=$(date +%s.%N)
            docker run --rm --platform linux/amd64 --network none --cpus 2 \
              --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
              --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp \
              --volume $PWD/sample/commits:/data/commits:ro \
              --volume $PWD/sample/tests.json:/data/tests.json:ro \
              --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
              > ci/output$i.jsonl 2> ci/stderr$i.log || echo "run failed $?" >> ci/stderr$i.log
            echo "wall: $(echo "$(date +%s.%N) - $start" | bc)" >> ci/stderr$i.log
            python3 score.py sample sample/answers.json ci/output$i.jsonl > ci/score$i.txt 2>&1 || true
            cat ci/score$i.txt; tail -n 3 ci/stderr$i.log
          done
          python3 tools/score_truth.py sample/tests.json sample/answers.json ci/output1.jsonl > ci/breakdown.txt 2>&1 || true
          cat ci/breakdown.txt
      - name: Probe check on mutants (real environment)
        if: hashFiles('tools/mutants.tar.gz') != ''
        run: |
          mkdir -p /tmp/mut/commits ci/probe && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          chmod -R a+rwX ci/probe
          docker run --rm --network none --cpus 2 --memory 4096m --pids-limit 256 \
            --tmpfs /tmp:rw,size=512m,mode=1777 --user 65534:65534 --env HOME=/tmp \
            --env BR_BET_LOG=/out/bets.json \
            --volume /tmp/mut/commits:/data/commits:ro --volume /tmp/mut/tests.json:/data/tests.json:ro \
            --volume $PWD/ci/probe:/out --volume $PWD/tools:/tools:ro \
            --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py > /out/output.jsonl 2> /out/stderr.log; python /tools/check_bets.py /data/commits /out/bets.json /out/report.json > /out/check.log 2>&1' || true
          tail -n 5 ci/probe/stderr.log; cat ci/probe/check.log | tail -n 60
          python3 tools/score_truth.py /tmp/mut/tests.json tools/truth.json ci/probe/output.jsonl > ci/probe/score.txt 2>&1 || true
          cpu=$(grep -o "cpu self [0-9.]*s children [0-9.]*s" ci/probe/stderr.log); echo "selector $cpu" >> ci/probe/score.txt
          cat ci/probe/score.txt
      - name: Check on the second patch set with stored truth
        if: hashFiles('tools/truth2.json') != ''
        run: |
          rm -rf /tmp/m2 && mkdir -p /tmp/m2/commits ci/m2 && tar xzf tools/mutants2.tar.gz -C /tmp/m2/commits
          cp sample/tests.json /tmp/m2/tests.json
          docker run --rm --platform linux/amd64 --network none --cpus 2 \
            --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
            --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp \
            --volume /tmp/m2/commits:/data/commits:ro --volume /tmp/m2/tests.json:/data/tests.json:ro \
            --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
            > ci/m2/out.jsonl 2> ci/m2/err.log || true
          python3 tools/score_truth.py /tmp/m2/tests.json tools/truth2.json ci/m2/out.jsonl > ci/m2/score.txt 2>&1 || true
          grep -o "usage_usec [0-9]*" ci/m2/err.log >> ci/m2/score.txt || true
          cat ci/m2/score.txt
      - name: Audit leave-out decisions on fresh body-only mutants (only with [audit])
        if: contains(github.event.head_commit.message, '[audit]')
        run: |
          rm -rf /tmp/m3 && mkdir -p /tmp/m3/commits ci/audit && tar xzf tools/mutants3.tar.gz -C /tmp/m3/commits
          cp sample/tests.json /tmp/m3/tests.json
          chmod -R a+rwX ci/audit
          while read name envs; do
            eargs=""; for e in $envs; do eargs="$eargs --env $e"; done
            docker run --rm --network none --cpus 4 --memory 12g --pids-limit 1024 \
              --tmpfs /tmp:rw,size=4g,mode=1777 --user 65534:65534 --env HOME=/tmp \
              --env BR_BUDGET=1500 --env BR_RUN_LOG=/out/runs_$name.json --env BR_BET_LOG=/out/bets_$name.json $eargs \
              --volume /tmp/m3:/data:ro --volume $PWD/ci/audit:/out --volume $PWD/tools:/tools:ro \
              --entrypoint sh blast-radius-entry -c "python /app/br/selector.py > /out/sel_$name.jsonl 2> /out/err_$name.log; python /tools/check_bets_par.py /data/commits /out/bets_$name.json /out/betrep_$name.json > /out/bets_$name.log 2>&1" || true
            echo "== $name"; grep "done:" ci/audit/err_$name.log || true; grep -c "betting" ci/audit/err_$name.log || true; grep -v "'failed': \[\]" ci/audit/bets_$name.log | tail -n 30 || true
          done <<'EOF'
          P BR_PROBE_ALL=1
          P5 BR_PROBE_ALL=1 BR_PROBE_MIN_EV=5 BR_PROBE_MIN_HITS=20
          EOF
      - name: Sweep settings on mutants (truth) and samples (only with [sweep])
        if: contains(github.event.head_commit.message, '[sweep]')
        run: |
          mkdir -p /tmp/mut/commits ci/sweep && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          mkdir -p /tmp/m2s/commits && tar xzf tools/mutants2.tar.gz -C /tmp/m2s/commits && cp sample/tests.json /tmp/m2s/tests.json
          rm -f ci/sweep/summary.txt
          while read name envs; do
            for set in mut sample m2; do
              if [ $set = mut ]; then D=/tmp/mut; T=tools/truth.json; elif [ $set = m2 ]; then D=/tmp/m2s; T=tools/truth2.json; else D=$PWD/sample; T=sample/answers.json; fi
              eargs=""; for e in $envs; do eargs="$eargs --env $e"; done
              docker run --rm --platform linux/amd64 --network none --cpus 2 \
                --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
                --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
                --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp $eargs \
                --volume $D/commits:/data/commits:ro --volume $D/tests.json:/data/tests.json:ro \
                --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
                > ci/sweep/out_${set}_$name.jsonl 2> ci/sweep/err_${set}_$name.log || true
              cpu=$(grep -o "usage_usec [0-9]*" ci/sweep/err_${set}_$name.log | awk '{print $2/1000000}')
              python3 tools/score_truth.py $D/tests.json $T ci/sweep/out_${set}_$name.jsonl > ci/sweep/score_${set}_$name.txt 2>&1
              echo "$name $set: $(tail -n 1 ci/sweep/score_${set}_$name.txt) CPU $cpu" | tee -a ci/sweep/summary.txt
            done
          done < tools/sweep.txt
      - name: Calibrate on mutants with stored truth (only with [calib])
        if: contains(github.event.head_commit.message, '[calib]')
        run: |
          mkdir -p /tmp/mut/commits ci/calib && tar xzf tools/mutants.tar.gz -C /tmp/mut/commits
          cp sample/tests.json /tmp/mut/tests.json
          for f in 1.0 1.5 2.0 2.5; do
            for set in mut sample; do
              if [ $set = mut ]; then D=/tmp/mut; T=tools/truth.json; else D=$PWD/sample; T=""; fi
              docker run --rm --platform linux/amd64 --network none --cpus 2 \
                --memory 4096m --memory-swap 4096m --pids-limit 256 --read-only \
                --tmpfs /tmp:rw,size=64m,mode=1777 --cap-drop ALL \
                --security-opt no-new-privileges --user 65534:65534 --env HOME=/tmp --env BR_CPU_FACTOR=$f \
                --volume $D/commits:/data/commits:ro --volume $D/tests.json:/data/tests.json:ro \
                --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py; echo "cgroup cpu: $(grep usage_usec /sys/fs/cgroup/cpu.stat)" >&2' \
                > ci/calib/out_${set}_$f.jsonl 2> ci/calib/err_${set}_$f.log || true
              cpu=$(grep -o "usage_usec [0-9]*" ci/calib/err_${set}_$f.log | awk '{print $2/1000000}')
              if [ $set = mut ]; then r=$(python3 tools/score_truth.py /tmp/mut/tests.json $T ci/calib/out_${set}_$f.jsonl | tail -n 1)
              else r=$(python3 score.py sample sample/answers.json ci/calib/out_${set}_$f.jsonl | head -n 2 | tr '\n' ' '); fi
              echo "factor $f $set: $r CPU $cpu" | tee -a ci/calib/summary.txt
            done
          done
      - name: Ground truth on a patch set (only when the commit message has [truth] or [truth2])
        if: contains(github.event.head_commit.message, '[truth')
        run: |
          SET=mutants; if echo "${{ github.event.head_commit.message }}" | grep -q '\[truth2\]'; then SET=mutants2; fi
          rm -rf /tmp/tset && mkdir -p /tmp/tset/commits ci/truth_$SET && tar xzf tools/$SET.tar.gz -C /tmp/tset/commits
          cp sample/tests.json /tmp/tset/tests.json
          chmod -R a+rwX ci/truth_$SET
          docker run --rm --network none --cpus 4 --memory 12g --pids-limit 1024 \
            --tmpfs /tmp:rw,size=4g,mode=1777 --user 65534:65534 --env HOME=/tmp \
            --volume /tmp/tset:/data:ro --volume $PWD/ci/truth_$SET:/out --volume $PWD/tools:/tools:ro \
            --entrypoint sh blast-radius-entry -c 'python /app/br/selector.py > /out/selected.jsonl 2> /out/stderr.log; python /tools/truth.py /data /out/selected.jsonl /out/truth.json > /out/truth.log 2>&1' || true
          tail -n 60 ci/truth_$SET/truth.log
      - name: Export the in-image map and cpu costs
        run: |
          docker run --rm --entrypoint cat blast-radius-entry /app/br/maps/map.json.gz > ci/map.json.gz
          docker run --rm --entrypoint cat blast-radius-entry /app/br/maps/cpu.json > ci/cpu.json
      - name: Keep results as a download (nothing is committed to the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: ci
